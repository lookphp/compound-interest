<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="利弗莫尔时间线" class="fig">
<rect width="680" height="380" fill="#ffffff"/>
<text x="58" y="20" font-size="13.5" font-weight="700" fill="#1f2328">杰西·利弗莫尔（1877–1940）：同一个人，两次巅峰，四次破产</text>
<path d="M75.6,184.0 L631.5,184.0" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/>
<line x1="102.1" y1="184.0" x2="102.1" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="102.1" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1880</text>
<line x1="190.4" y1="184.0" x2="190.4" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="190.4" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1890</text>
<line x1="278.6" y1="184.0" x2="278.6" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="278.6" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1900</text>
<line x1="366.8" y1="184.0" x2="366.8" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="366.8" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1910</text>
<line x1="455.1" y1="184.0" x2="455.1" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="455.1" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1920</text>
<line x1="543.3" y1="184.0" x2="543.3" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="543.3" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1930</text>
<line x1="631.5" y1="184.0" x2="631.5" y2="188.0" stroke="#5b6570" stroke-width="1"/>
<text x="631.5" y="202.0" text-anchor="middle" font-size="10.5" fill="#5b6570">1940</text>
<text x="358" y="372" text-anchor="middle" font-size="12" fill="#5b6570">年份</text>
<circle cx="75.6" cy="184.0" r="4.5" fill="#1f2328"/>
<line x1="75.6" y1="176.0" x2="75.6" y2="126.0" stroke="#1f2328" stroke-width="1" stroke-dasharray="3 3"/>
<text x="81.6" y="112.0" text-anchor="start" font-size="11" font-weight="700" fill="#1f2328">出生</text>
<circle cx="340.4" cy="184.0" r="4.5" fill="#166534"/>
<line x1="340.4" y1="176.0" x2="340.4" y2="126.0" stroke="#166534" stroke-width="1" stroke-dasharray="3 3"/>
<text x="346.4" y="112.0" text-anchor="start" font-size="11" font-weight="700" fill="#166534">做空：单日赚</text>
<text x="346.4" y="127.0" text-anchor="start" font-size="11" font-weight="700" fill="#166534">约 300 万美元</text>
<circle cx="349.2" cy="184.0" r="4.5" fill="#b91c1c"/>
<line x1="349.2" y1="192.0" x2="349.2" y2="242.0" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
<text x="355.2" y="252.0" text-anchor="start" font-size="11" font-weight="700" fill="#b91c1c">第一次破产</text>
<circle cx="534.5" cy="184.0" r="4.5" fill="#166534"/>
<line x1="534.5" y1="176.0" x2="534.5" y2="126.0" stroke="#166534" stroke-width="1" stroke-dasharray="3 3"/>
<text x="528.5" y="112.0" text-anchor="end" font-size="11" font-weight="700" fill="#166534">做空获利约 1 亿美元</text>
<text x="528.5" y="127.0" text-anchor="end" font-size="11" font-weight="700" fill="#166534">（此数有争议）</text>
<circle cx="578.6" cy="184.0" r="4.5" fill="#b91c1c"/>
<line x1="578.6" y1="192.0" x2="578.6" y2="242.0" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3"/>
<text x="572.6" y="252.0" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">第四次破产</text>
<text x="572.6" y="267.0" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c">资产 18.49 万 / 负债 225.9 万</text>
<circle cx="631.5" cy="184.0" r="4.5" fill="#1f2328"/>
<line x1="631.5" y1="176.0" x2="631.5" y2="126.0" stroke="#1f2328" stroke-width="1" stroke-dasharray="3 3"/>
<text x="625.5" y="112.0" text-anchor="end" font-size="11" font-weight="700" fill="#1f2328">生命结束</text>
<line x1="508" y1="40" x2="530" y2="40" stroke="#166534" stroke-width="2.4"/>
<text x="536" y="44" font-size="11.5" fill="#1f2328">做对的年份</text>
<line x1="508" y1="58" x2="530" y2="58" stroke="#b91c1c" stroke-width="2.4"/>
<text x="536" y="62" font-size="11.5" fill="#1f2328">归零的年份</text>
</svg>